name: Deploy BEKIUZ AI Manager

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
      - name: Verify deployed Worker health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 https://bekiuz-ai-manager.bekiuz67.workers.dev/api/health)"
          echo "$response" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              if (!data.ok || !data.databaseConfigured || !data.aiConfigured || !data.authConfigured) {
                console.error("Health check failed:", data);
                process.exit(1);
              }
              console.log("Worker health OK: AI, D1, and owner auth configured.");
            });
          '
